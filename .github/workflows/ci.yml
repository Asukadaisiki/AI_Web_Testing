name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browser_smoke:
        description: Build the production stack and launch Chromium
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go test, vet, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

  python:
    name: Browser Worker sync, compile, unittest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
          cache-dependency-glob: browser-worker/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev
      - run: uv run python -m compileall -q app tests
      - run: uv run python -m unittest discover -s tests -p "test_*.py"
      - run: python ../scripts/check_bug_log.py

  frontend:
    name: Frontend install, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke:install -- --with-deps
      - run: npm run test:smoke

  deployment-config:
    name: Validate production Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file deploy/prod.env.example -f compose.prod.yml config --quiet

  browser-smoke:
    name: Optional production browser smoke
    if: (github.event_name == 'workflow_dispatch' && inputs.browser_smoke) || vars.RUN_BROWSER_SMOKE == 'true'
    needs:
      - go
      - python
      - frontend
      - deployment-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start production stack
        run: docker compose --env-file deploy/prod.env.example -f compose.prod.yml up -d --build --wait
      - name: Verify reverse proxy and Chromium
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/internal/browser-capabilities)" = "404"
          docker compose --env-file deploy/prod.env.example -f compose.prod.yml run --rm --no-deps python-worker \
            python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); page=b.new_page(); page.goto('http://frontend:8080'); assert page.locator('#root').count() == 1; b.close(); p.stop()"
      - name: Show container logs
        if: failure()
        run: docker compose --env-file deploy/prod.env.example -f compose.prod.yml logs --no-color
      - name: Stop production stack
        if: always()
        run: docker compose --env-file deploy/prod.env.example -f compose.prod.yml down --volumes
