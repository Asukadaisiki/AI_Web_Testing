[project]
name = "ai-web-testing-browser-worker"
version = "0.1.0"
description = "Playwright browser worker for the AI web testing platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "playwright>=1.52,<2.0",
    "pillow>=11.0,<12.0",
    "uvicorn>=0.35,<1.0",
]

[project.scripts]
browser-worker-dev = "browser_worker.server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_worker"]
