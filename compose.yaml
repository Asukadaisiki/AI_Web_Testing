services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agenttrace
      POSTGRES_PASSWORD: agenttrace
      POSTGRES_DB: agenttrace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenttrace -d agenttrace"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 18

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    command: ["bash", "/opt/agenttrace/kafka_init_topics.sh"]
    environment:
      AGENTTRACE_KAFKA_PARTITIONS: "8"
    volumes:
      - ./integration/v3/kafka_init_topics.sh:/opt/agenttrace/kafka_init_topics.sh:ro

  fixture-site:
    image: nginx:1.28-alpine
    volumes:
      - ./worker/fixtures/site:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8123:80"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
      args:
        UV_PACKAGE_BASE: ${UV_PACKAGE_BASE:-https://files.pythonhosted.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
    working_dir: /app/worker
    command: ["uv", "run", "--no-sync", "uvicorn", "loop_worker.main:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      LOOP_ARTIFACTS_DIR: /artifacts
      LOOP_BLOCKED_RESOURCE_HOSTS: pagead2.googlesyndication.com,googleads.g.doubleclick.net,fundingchoicesmessages.google.com,static.cloudflareinsights.com
    depends_on:
      - fixture-site
    volumes:
      - artifacts:/artifacts

  api:
    image: golang:1.24
    working_dir: /app/backend
    command: ["go", "run", "./cmd/agenttrace-api"]
    environment:
      GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
      AGENTTRACE_POSTGRES_DSN: ${AGENTTRACE_POSTGRES_DSN:-postgres://agenttrace:agenttrace@postgres:5432/agenttrace?sslmode=disable}
      AGENTTRACE_KAFKA_BROKERS: ${AGENTTRACE_KAFKA_BROKERS:-kafka:9092}
      AGENTTRACE_REDIS_ADDR: ${AGENTTRACE_REDIS_ADDR:-redis:6379}
      AGENTTRACE_WORKER_URL: ${AGENTTRACE_WORKER_URL:-http://worker:8100}
      AGENTTRACE_HTTP_ADDR: :8080
      AGENTTRACE_ARTIFACT_DIR: /artifacts
      AGENTTRACE_MODEL_NAME: ${AGENTTRACE_MODEL_NAME:-glm-5.3-flash}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - artifacts:/artifacts

  runtime:
    build:
      context: .
      dockerfile: pi-browser-harness/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    working_dir: /app/backend
    command: ["go", "run", "./cmd/agenttrace-runtime"]
    environment:
      GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
      AGENTTRACE_POSTGRES_DSN: ${AGENTTRACE_POSTGRES_DSN:-postgres://agenttrace:agenttrace@postgres:5432/agenttrace?sslmode=disable}
      AGENTTRACE_KAFKA_BROKERS: ${AGENTTRACE_KAFKA_BROKERS:-kafka:9092}
      AGENTTRACE_REDIS_ADDR: ${AGENTTRACE_REDIS_ADDR:-redis:6379}
      AGENTTRACE_WORKER_URL: ${AGENTTRACE_WORKER_URL:-http://worker:8100}
      AGENTTRACE_ARTIFACT_DIR: /artifacts
      AGENTTRACE_RUNTIME_CONCURRENCY: ${AGENTTRACE_RUNTIME_CONCURRENCY:-4}
      AGENTTRACE_MODEL_BASE_URL: ${AGENTTRACE_MODEL_BASE_URL:-https://api.unself.cn/v1}
      AGENTTRACE_MODEL_NAME: ${AGENTTRACE_MODEL_NAME:-glm-5.3-flash}
      AGENTTRACE_MODEL_REASONING_EFFORT: ${AGENTTRACE_MODEL_REASONING_EFFORT:-high}
      AGENTTRACE_MODEL_API_KEY: ${AGENTTRACE_MODEL_API_KEY:-}
      AGENTTRACE_PI_HARNESS_ENTRY: ${AGENTTRACE_PI_HARNESS_ENTRY:-/app/pi-browser-harness/dist/main.js}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - artifacts:/artifacts

  exporter:
    profiles: ["langfuse"]
    image: golang:1.24.11
    working_dir: /app/backend
    command: ["go", "run", "./cmd/agenttrace-exporter"]
    environment:
      GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
      AGENTTRACE_LANGFUSE_ENABLED: "true"
      AGENTTRACE_POSTGRES_DSN: ${AGENTTRACE_POSTGRES_DSN:-postgres://agenttrace:agenttrace@postgres:5432/agenttrace?sslmode=disable}
      AGENTTRACE_KAFKA_BROKERS: ${AGENTTRACE_KAFKA_BROKERS:-kafka:9092}
      AGENTTRACE_LANGFUSE_BASE_URL: ${AGENTTRACE_LANGFUSE_BASE_URL:-}
      AGENTTRACE_LANGFUSE_PUBLIC_KEY: ${AGENTTRACE_LANGFUSE_PUBLIC_KEY:-}
      AGENTTRACE_LANGFUSE_SECRET_KEY: ${AGENTTRACE_LANGFUSE_SECRET_KEY:-}
      AGENTTRACE_LANGFUSE_GROUP_ID: ${AGENTTRACE_LANGFUSE_GROUP_ID:-agenttrace-langfuse-exporter}
      AGENTTRACE_LANGFUSE_MAX_ATTEMPTS: ${AGENTTRACE_LANGFUSE_MAX_ATTEMPTS:-3}
      AGENTTRACE_LANGFUSE_MAX_REQUEST_BYTES: ${AGENTTRACE_LANGFUSE_MAX_REQUEST_BYTES:-1048576}
      AGENTTRACE_LANGFUSE_REDACT_FIELDS: ${AGENTTRACE_LANGFUSE_REDACT_FIELDS:-authorization,cookie,password,token,api_key,secret}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - .:/app

  web:
    image: node:22-alpine
    working_dir: /app/web
    command: ["sh", "-c", "npm ci --cache /tmp/npm-cache && npm run dev -- --host 0.0.0.0"]
    environment:
      AGENTTRACE_API_URL: http://api:8080
    depends_on:
      - api
    ports:
      - "5174:5174"
    volumes:
      - .:/app
      - web-node-modules:/app/web/node_modules

volumes:
  artifacts:
  postgres-data:
  web-node-modules:
