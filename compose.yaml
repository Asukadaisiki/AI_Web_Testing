services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agenttrace
      POSTGRES_PASSWORD: agenttrace
      POSTGRES_DB: agenttrace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenttrace -d agenttrace"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 18

  worker:
    image: ghcr.io/astral-sh/uv:0.7-python3.14-bookworm
    working_dir: /app/worker
    command: ["uv", "run", "uvicorn", "loop_worker.main:app", "--host", "0.0.0.0", "--port", "8100"]
    volumes:
      - .:/app

  api:
    image: golang:1.26
    working_dir: /app/backend
    command: ["go", "run", "./cmd/agenttrace-api"]
    environment:
      AGENTTRACE_POSTGRES_DSN: ${AGENTTRACE_POSTGRES_DSN:-postgres://agenttrace:agenttrace@postgres:5432/agenttrace?sslmode=disable}
      AGENTTRACE_KAFKA_BROKERS: ${AGENTTRACE_KAFKA_BROKERS:-kafka:9092}
      AGENTTRACE_REDIS_ADDR: ${AGENTTRACE_REDIS_ADDR:-redis:6379}
      AGENTTRACE_WORKER_URL: ${AGENTTRACE_WORKER_URL:-http://worker:8100}
      AGENTTRACE_HTTP_ADDR: :8080
      AGENTTRACE_ARTIFACT_DIR: /artifacts
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - artifacts:/artifacts

  runtime:
    image: golang:1.26
    working_dir: /app/backend
    command: ["go", "run", "./cmd/agenttrace-runtime"]
    environment:
      AGENTTRACE_POSTGRES_DSN: ${AGENTTRACE_POSTGRES_DSN:-postgres://agenttrace:agenttrace@postgres:5432/agenttrace?sslmode=disable}
      AGENTTRACE_KAFKA_BROKERS: ${AGENTTRACE_KAFKA_BROKERS:-kafka:9092}
      AGENTTRACE_REDIS_ADDR: ${AGENTTRACE_REDIS_ADDR:-redis:6379}
      AGENTTRACE_WORKER_URL: ${AGENTTRACE_WORKER_URL:-http://worker:8100}
      AGENTTRACE_ARTIFACT_DIR: /artifacts
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - .:/app
      - artifacts:/artifacts

  web:
    image: node:22-alpine
    working_dir: /app/web
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      - api
    ports:
      - "5174:5173"
    volumes:
      - .:/app

volumes:
  artifacts:
  postgres-data:
