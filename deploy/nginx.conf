server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location = /api/v1/internal {
        return 404;
    }

    location ^~ /api/v1/internal/ {
        return 404;
    }

    location = /api/v2/agent {
        proxy_pass http://agentcore:8081;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/v2/agent/ {
        proxy_pass http://agentcore:8081;
        include /etc/nginx/proxy_params;
    }

    location = /api/v2/planning {
        proxy_pass http://agentcore:8081;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/v2/planning/ {
        proxy_pass http://agentcore:8081;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/ {
        proxy_pass http://python-api:8000;
        include /etc/nginx/proxy_params;
    }

    location ^~ /artifacts/ {
        proxy_pass http://python-api:8000;
        include /etc/nginx/proxy_params;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
