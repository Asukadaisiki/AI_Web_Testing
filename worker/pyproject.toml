[project]
name = "loop-worker"
version = "0.1.0"
description = "AgentTrace Eval Hub v3 Playwright browser worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # Pin the browser package used by the Compose worker and local test suite.
    "playwright==1.57.0",
    "pydantic>=2.9",
    "cryptography>=44",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
]

[tool.uv]
# This directory is run in place; uv resolves loop_worker from the cwd.
package = false
