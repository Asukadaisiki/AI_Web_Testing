[project]
name = "ai-web-testing-backend"
version = "0.1.0"
description = "Backend skeleton for AI-enhanced web UI testing platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.16,<2.0",
    "itsdangerous>=2.2,<3.0",
    "playwright>=1.52,<2.0",
    "pillow>=11.0,<12.0",
    "psycopg[binary]>=3.2,<4.0",
    "uvicorn>=0.35,<1.0",
    "httpx>=0.28,<1.0",
]

[project.scripts]
backend-dev = "app.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/e2e"]
markers = [
    "browser_integration: real-browser integration tests for local regression fixtures",
    "e2e_api: E2E API tests requiring a running backend server",
]
